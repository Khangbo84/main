<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Item Unavailable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/oops.css">
</head>
<body>
  <div class="oops-container">
    <div class="oops-content">
      <!-- Animated icon -->
      <div class="oops-icon">
        <span class="icon-emoji">⏳</span>
      </div>

      <!-- Title -->
      <h1 class="oops-title">OOPS!</h1>
      
      <!-- Message -->
      <p class="oops-message">
        This item is currently unavailable.
      </p>
      <p class="oops-submessage">
        Please come back later.
      </p>

      <!-- Countdown -->
      <div class="countdown-wrapper">
        <p class="countdown-label">Available in:</p>
        <div class="countdown" id="countdown">
          <span class="countdown-value" id="countdownText">Loading...</span>
        </div>
      </div>

      <!-- Item Info -->
      <div class="item-info" id="itemInfo">
        <p id="itemTitle" class="item-title"></p>
        <p id="itemDesc" class="item-desc"></p>
      </div>

      <!-- Action Button -->
      <button class="btn-back" onclick="goBack()">← Back to Menu</button>
    </div>

    <!-- Decorative elements -->
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    <div class="decoration decoration-3"></div>
  </div>

  <script>
    let itemData = null;

    // Get item data from URL params or sessionStorage
    function getItemData() {
      const params = new URLSearchParams(window.location.search);
      const itemTitle = params.get('title');
      const itemDesc = params.get('desc');
      const expiryDate = params.get('expiry');
      
      if (itemTitle && itemDesc && expiryDate) {
        return { title: itemTitle, desc: itemDesc, expiry: expiryDate };
      }
      
      // Try from sessionStorage
      const stored = sessionStorage.getItem('oopsItemData');
      if (stored) {
        return JSON.parse(stored);
      }
      
      return null;
    }

    function startCountdown() {
      itemData = getItemData();
      
      if (!itemData) {
        document.getElementById('countdownText').textContent = 'Unknown expiry date';
        return;
      }

      // Display item info
      if (itemData.title) {
        document.getElementById('itemTitle').textContent = itemData.title;
      }
      if (itemData.desc) {
        document.getElementById('itemDesc').textContent = itemData.desc;
      }

      function updateCountdown() {
        const expiryTime = new Date(itemData.expiry).getTime();
        const now = new Date().getTime();
        const diff = expiryTime - now;

        if (diff <= 0) {
          document.getElementById('countdownText').textContent = 'Available now!';
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

        let timeText = '';
        
        if (days > 10) {
          // Show days and hours only
          timeText = `${days} day${days !== 1 ? 's' : ''} ${hours} hour${hours !== 1 ? 's' : ''}`;
        } else if (days > 0) {
          // Show days, hours, and minutes
          timeText = `${days} day${days !== 1 ? 's' : ''} ${hours} hour${hours !== 1 ? 's' : ''} ${minutes} min`;
        } else {
          // Show only hours and minutes
          timeText = `${hours} hour${hours !== 1 ? 's' : ''} ${minutes} min`;
        }

        document.getElementById('countdownText').textContent = timeText;
      }

      // Update immediately
      updateCountdown();
      
      // Update every minute
      setInterval(updateCountdown, 60000);
    }

    function goBack() {
      window.history.back();
    }

    // Start countdown when page loads
    window.addEventListener('load', startCountdown);
  </script>
</body>
</html>
